<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClashAI">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#173f8f">
<meta name="format-detection" content="telephone=no">
<title>ClashAI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root {
  --gold-hi: #ffe36b; --gold-lo: #f5a90f; --gold-sh: #a8650a;
  --blue-hi: #5aa9ff; --blue-lo: #2b74e0; --blue-sh: #164b96;
  --red-hi: #ff7a6e; --red-lo: #d72f28; --red-sh: #8c1714;
  --green-hi: #8ee05a; --green-lo: #3fa823; --green-sh: #22660f;
  --dark-hi: #2f63b4; --dark-lo: #17386f; --dark-sh: #0b2149;
  --panel-hi: #1f56a8; --panel-lo: #123a7a; --panel-edge: #0a2358;
  --r-common: #8ea6c4; --r-rare: #f39a2d; --r-epic: #b054f0;
}
html, body {
  height: 100%; margin: 0; overflow: hidden;
  background: #0b1a3a; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; overscroll-behavior: none;
}
button { font: inherit; -webkit-tap-highlight-color: transparent; }
#game {
  position: fixed; left: 0; top: 0; width: 100%; height: 100%;
  display: none; touch-action: none; z-index: 0;
}
body.in-battle #game { display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.screen {
  position: absolute; inset: 0; display: none; flex-direction: column; gap: 12px;
  box-sizing: border-box; overflow: hidden; pointer-events: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-right, 0px) + 14px)
           calc(env(safe-area-inset-bottom, 0px) + 14px) calc(env(safe-area-inset-left, 0px) + 14px);
  background: radial-gradient(120% 55% at 50% 0%, #55b4ff 0%, #1d6bd0 42%, #0d2f72 80%, #0a2255 100%);
}
.screen.on { display: flex; }
.hud { background: none; padding: 0; pointer-events: none; }
.hud.on { display: block; }
.hud .hudbtn, .hud .overlay { pointer-events: auto; }
#probe {
  position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
           env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

/* Buttons: chunky, rounded, bottom shadow that compresses on press. */
.btn {
  display: block; width: 100%; box-sizing: border-box; border: 0; cursor: pointer;
  border-radius: 16px; padding: 13px 18px; color: #fff; font-weight: 900; font-size: 18px;
  letter-spacing: .4px; text-shadow: 0 2px 0 rgba(0,0,0,.25);
  background: linear-gradient(var(--blue-hi), var(--blue-lo));
  box-shadow: 0 6px 0 var(--blue-sh), 0 10px 16px rgba(0,0,0,.3);
  transition: transform .05s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-sh); }
.btn.gold {
  background: linear-gradient(var(--gold-hi), var(--gold-lo)); color: #4a2a00;
  text-shadow: 0 1px 0 rgba(255,255,255,.45);
  box-shadow: 0 7px 0 var(--gold-sh), 0 10px 18px rgba(0,0,0,.35);
}
.btn.gold:active { box-shadow: 0 2px 0 var(--gold-sh); }
.btn.red { background: linear-gradient(var(--red-hi), var(--red-lo)); box-shadow: 0 6px 0 var(--red-sh), 0 10px 16px rgba(0,0,0,.3); }
.btn.red:active { box-shadow: 0 2px 0 var(--red-sh); }
.btn.green { background: linear-gradient(var(--green-hi), var(--green-lo)); box-shadow: 0 6px 0 var(--green-sh), 0 10px 16px rgba(0,0,0,.3); }
.btn.dark { background: linear-gradient(var(--dark-hi), var(--dark-lo)); box-shadow: 0 6px 0 var(--dark-sh), 0 10px 16px rgba(0,0,0,.3); }
.btn.dark:active { box-shadow: 0 2px 0 var(--dark-sh); }
.btn.sm { display: inline-block; width: auto; font-size: 15px; padding: 9px 14px; border-radius: 12px; box-shadow: 0 4px 0 var(--dark-sh); }
.btn.sm:active { box-shadow: 0 1px 0 var(--dark-sh); }
.btn.xl { font-size: 28px; padding: 18px; border-radius: 20px; }

.panel {
  background: linear-gradient(var(--panel-hi), var(--panel-lo));
  border: 3px solid var(--panel-edge); border-radius: 18px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 8px 20px rgba(0,0,0,.3);
  box-sizing: border-box;
}
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
  border-radius: 999px; background: rgba(0,0,0,.28); font-weight: 800; font-size: 15px;
}
.pill b { color: var(--gold-hi); font-weight: 900; }
.iconbtn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; color: #fff;
  background: rgba(0,0,0,.28); font-size: 20px; box-shadow: 0 3px 0 rgba(0,0,0,.3);
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* Home */
#home .logo {
  margin: 4px 0 0; text-align: center; font-size: 56px; font-weight: 900; letter-spacing: 1px;
  color: var(--gold-hi);
  text-shadow: 0 4px 0 #8a4b00, 0 8px 0 #5e3200, 0 14px 20px rgba(0,0,0,.4);
}
.rec { display: flex; justify-content: center; gap: 14px; font-size: 14px; font-weight: 700; opacity: .92; }
.rec b { color: var(--gold-hi); font-weight: 900; }
.decks { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.minis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.avgline { text-align: center; font-size: 14px; font-weight: 700; }
.avgline b { color: var(--gold-hi); font-weight: 900; }
.spacer { flex: 1; min-height: 4px; }
.seg {
  display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(0,0,0,.3);
}
.seg button {
  flex: 1; border: 0; border-radius: 10px; padding: 10px 4px; background: transparent;
  color: #cfe3ff; font-weight: 800; font-size: 15px;
}
.seg button.on { background: linear-gradient(var(--gold-hi), var(--gold-lo)); color: #4a2a00; box-shadow: 0 3px 0 var(--gold-sh); }
#home .btn + .btn { margin-top: 0; }

/* Card tiles */
.tile {
  position: relative; box-sizing: border-box; min-width: 0; aspect-ratio: 0.8;
  border-radius: 12px; padding: 3px; background: var(--rc, var(--r-common));
  box-shadow: 0 3px 0 rgba(0,0,0,.35); cursor: pointer;
}
.tile.r-common { --rc: var(--r-common); }
.tile.r-rare { --rc: var(--r-rare); }
.tile.r-epic { --rc: var(--r-epic); }
.tile.r-legendary { background: conic-gradient(#ff5d6c, #ffd84d, #7dff6a, #5ce1ff, #8a6cff, #ff6ad5, #ff5d6c); }
.tin {
  position: absolute; inset: 3px; border-radius: 9px; overflow: hidden; padding: 2px;
  background: linear-gradient(#2f70c8, #14407f);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.emo { font-size: 26px; line-height: 1; }
.tn {
  max-width: 100%; padding: 0 3px; font-size: 10px; font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.drop {
  position: absolute; top: -5px; left: -5px; z-index: 1; box-sizing: border-box;
  min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px;
  background: radial-gradient(circle at 35% 30%, #f5b6ff, #b02fe0 70%);
  border: 2px solid #fff; color: #fff; font-weight: 900; font-size: 12px;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.tile.mini { aspect-ratio: auto; height: 62px; }
.tile.mini .emo { font-size: 22px; }
.tile.mini .drop { min-width: 18px; height: 18px; font-size: 10px; top: -4px; left: -4px; }
.tile.sel { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--gold-hi), 0 3px 0 rgba(0,0,0,.35); }
.tile.used .tin { opacity: .5; }

/* Deck builder */
#deck .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#deck h2 { margin: 0; font-size: 22px; font-weight: 900; }
.dslots { padding: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.dslots .tile { cursor: pointer; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 6px 16px; }
.overlay {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  padding: 20px; box-sizing: border-box; z-index: 5; background: rgba(4,12,34,.62);
}
.overlay.open { display: flex; }
.sheet {
  width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.sh { display: flex; gap: 12px; align-items: center; }
.emo.big { font-size: 48px; }
.sh h3 { margin: 0; font-size: 20px; font-weight: 900; }
.sub { font-size: 13px; opacity: .8; margin-top: 2px; }
.stats { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stats > div {
  display: flex; justify-content: space-between; gap: 6px; padding: 6px 8px;
  border-radius: 10px; background: rgba(0,0,0,.22);
}
.stats dt { font-size: 13px; opacity: .75; }
.stats dd { margin: 0; font-size: 13px; font-weight: 900; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span {
  padding: 4px 10px; border-radius: 999px; background: #0c2a63;
  border: 2px solid #3f78cf; font-size: 12px; font-weight: 700;
}

/* Result */
#result .res {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; text-align: center;
}
.rtitle { margin: 0; font-size: 56px; font-weight: 900; text-shadow: 0 5px 0 rgba(0,0,0,.35); }
.res.win .rtitle { color: var(--gold-hi); }
.res.loss .rtitle { color: var(--red-hi); }
.res.draw .rtitle { color: #cfe3ff; }
.crowns { display: flex; gap: 28px; align-items: center; }
.side { display: flex; gap: 6px; }
.crown { width: 40px; height: 34px; }
.crown path { fill: var(--c); stroke: rgba(0,0,0,.35); stroke-width: .8; }
.crown.off { opacity: .22; }
.trophy { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 900; }
.trophy b { color: var(--gold-hi); }
.delta { font-size: 16px; padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.3); }
.delta.up { color: var(--green-hi); }
.delta.down { color: var(--red-hi); }
.why { margin: 0; font-size: 15px; font-weight: 700; opacity: .85; }
#result .btn { max-width: 260px; }

/* Battle HUD */
.hudbtn {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 6px); left: calc(env(safe-area-inset-left, 0px) + 6px);
  width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%;
  background: rgba(10,30,70,.72); box-shadow: 0 3px 0 rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center;
}
.hudbtn svg { width: 14px; height: 14px; fill: #fff; }
.cd {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  font-size: 128px; font-weight: 900; color: #fff; text-shadow: 0 8px 0 rgba(0,0,0,.35);
  pointer-events: none;
}
.cd.on { display: flex; }
.cd.pop { animation: pop .9s ease-out; }
@keyframes pop {
  0% { transform: scale(1.6); opacity: 0; }
  25% { transform: scale(1); opacity: 1; }
  100% { transform: scale(.9); opacity: 0; }
}
.pmenu { width: min(280px, 80%); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Battle"></canvas>
<div id="ui">
  <section class="screen" id="home"></section>
  <section class="screen" id="deck"></section>
  <section class="screen" id="result"></section>
  <section class="screen hud" id="hud"></section>
</div>
<div id="probe"></div>
<script>
// Card and unit data. Stats approximate Clash Royale tournament standard (level 11).
// Distances are in tiles, times in seconds, speeds in tiles/second.
// Speed tiers: slow 0.75, medium 1.0, fast 1.5, very fast 2.0.
var CR = (globalThis.CR = globalThis.CR || {});

CR.ARENA = {
  W: 18,
  H: 32,
  RIVER_TOP: 15, // river occupies y in [15, 17]
  RIVER_BOTTOM: 17,
  BRIDGES: [
    { x: 3.5, halfWidth: 1.5 },
    { x: 14.5, halfWidth: 1.5 },
  ],
};

// Tower layout for team 0 (bottom). Team 1 mirrors with y' = 32 - y.
CR.TOWERS = {
  princess: { hp: 3052, damage: 109, hitSpeed: 0.8, range: 7.5, r: 1.5, size: 3, projectile: { speed: 14, kind: 'arrow' } },
  king: { hp: 4824, damage: 109, hitSpeed: 1.0, range: 7.0, r: 2.0, size: 4, projectile: { speed: 12, kind: 'cannonball' } },
  layout: [
    { type: 'princess', lane: 0, x: 3.5, y: 25.5 },
    { type: 'princess', lane: 1, x: 14.5, y: 25.5 },
    { type: 'king', lane: -1, x: 9, y: 29 },
  ],
};

CR.ELIXIR = {
  start: 5,
  max: 10,
  regen: 2.8, // seconds per elixir at 1x
};

CR.MATCH = {
  regulation: 180,
  doubleAt: 60, // seconds remaining in regulation when 2x starts
  overtime: 120, // sudden death, 2x for first 60s, 3x for last 60s
};

// kind: 'troop' | 'building'
// targets: 'ground' | 'both' | 'buildings'
// range is edge-to-edge (distance between centers minus both radii).
// loadTime: delay before the first hit after locking onto a target (also used after stun reset).
// Optional specials:
//   splash: radius of area damage around the impact point
//   splashAroundSelf: true -> splash centred on the attacker (Valkyrie)
//   projectile: { speed, kind } -> ranged; damage applies on arrival
//   charge: { dist, damageMult, speed } -> after moving dist tiles uninterrupted, next hit deals damageMult and moves at speed
//   jumpsRiver: ground unit that ignores the river (Hog Rider)
//   deathDamage: { damage, radius }
//   deathSpawn: { unit, count }
//   spawn: { unit, count, interval, first } -> periodic spawner (Witch, Tombstone, Goblin Hut)
//   ramp: { stages: [dmgPerHit...], stageTime } -> Inferno: damage per hit increases while locked on
//   kamikaze: { freeze } -> unit dies when it attacks, splash applies freeze seconds (Ice Spirit)
//   lifetime: building decay time; hp drains linearly to 0 over lifetime
CR.UNITS = {
  knight: { name: 'Knight', kind: 'troop', hp: 1766, damage: 202, hitSpeed: 1.2, loadTime: 0.7, range: 0.8, sight: 5.5, speed: 1.0, targets: 'ground', r: 0.5, mass: 6 },
  archer: { name: 'Archer', kind: 'troop', hp: 304, damage: 107, hitSpeed: 0.9, loadTime: 0.4, range: 5, sight: 5.5, speed: 1.0, targets: 'both', r: 0.4, mass: 3, projectile: { speed: 10, kind: 'arrow' } },
  giant: { name: 'Giant', kind: 'troop', hp: 4091, damage: 254, hitSpeed: 1.5, loadTime: 1.0, range: 0.8, sight: 7.5, speed: 0.75, targets: 'buildings', r: 0.75, mass: 18 },
  musketeer: { name: 'Musketeer', kind: 'troop', hp: 720, damage: 217, hitSpeed: 1.0, loadTime: 0.5, range: 6, sight: 6, speed: 1.0, targets: 'both', r: 0.45, mass: 5, projectile: { speed: 12, kind: 'bullet' } },
  minipekka: { name: 'Mini P.E.K.K.A', kind: 'troop', hp: 1361, damage: 720, hitSpeed: 1.6, loadTime: 0.5, range: 0.8, sight: 5.5, speed: 1.5, targets: 'ground', r: 0.5, mass: 4 },
  goblin: { name: 'Goblin', kind: 'troop', hp: 202, damage: 120, hitSpeed: 1.1, loadTime: 0.4, range: 0.5, sight: 5.5, speed: 2.0, targets: 'ground', r: 0.35, mass: 2 },
  speargoblin: { name: 'Spear Goblin', kind: 'troop', hp: 133, damage: 81, hitSpeed: 1.7, loadTime: 0.5, range: 5, sight: 5.5, speed: 2.0, targets: 'both', r: 0.35, mass: 2, projectile: { speed: 10, kind: 'spear' } },
  skeleton: { name: 'Skeleton', kind: 'troop', hp: 81, damage: 81, hitSpeed: 1.0, loadTime: 0.5, range: 0.5, sight: 5.5, speed: 1.5, targets: 'ground', r: 0.3, mass: 1 },
  babydragon: { name: 'Baby Dragon', kind: 'troop', air: true, hp: 1152, damage: 161, hitSpeed: 1.5, loadTime: 0.5, range: 3.5, sight: 5.5, speed: 1.5, targets: 'both', r: 0.6, mass: 5, splash: 1.5, projectile: { speed: 8, kind: 'fire' } },
  hogrider: { name: 'Hog Rider', kind: 'troop', hp: 1696, damage: 318, hitSpeed: 1.6, loadTime: 0.6, range: 0.8, sight: 9.5, speed: 2.0, targets: 'buildings', r: 0.6, mass: 8, jumpsRiver: true },
  valkyrie: { name: 'Valkyrie', kind: 'troop', hp: 1907, damage: 267, hitSpeed: 1.5, loadTime: 0.6, range: 0.8, sight: 5.5, speed: 1.0, targets: 'ground', r: 0.5, mass: 8, splash: 2.0, splashAroundSelf: true },
  wizard: { name: 'Wizard', kind: 'troop', hp: 755, damage: 281, hitSpeed: 1.4, loadTime: 0.6, range: 5.5, sight: 5.5, speed: 1.0, targets: 'both', r: 0.45, mass: 5, splash: 1.5, projectile: { speed: 10, kind: 'fire' } },
  minion: { name: 'Minion', kind: 'troop', air: true, hp: 230, damage: 107, hitSpeed: 1.0, loadTime: 0.5, range: 1.6, sight: 5.5, speed: 1.5, targets: 'both', r: 0.35, mass: 2, projectile: { speed: 12, kind: 'goo' } },
  prince: { name: 'Prince', kind: 'troop', hp: 1920, damage: 392, hitSpeed: 1.4, loadTime: 0.9, range: 1.6, sight: 5.5, speed: 1.0, targets: 'ground', r: 0.6, mass: 15, charge: { dist: 2.5, damageMult: 2, speed: 2.0 } },
  balloon: { name: 'Balloon', kind: 'troop', air: true, hp: 1679, damage: 640, hitSpeed: 2.0, loadTime: 1.0, range: 0.1, sight: 7.7, speed: 1.0, targets: 'buildings', r: 0.6, mass: 9, deathDamage: { damage: 272, radius: 3 } },
  bomber: { name: 'Bomber', kind: 'troop', hp: 304, damage: 225, hitSpeed: 1.8, loadTime: 0.6, range: 4.5, sight: 5.5, speed: 1.0, targets: 'ground', r: 0.4, mass: 3, splash: 1.5, projectile: { speed: 8, kind: 'bomb' } },
  pekka: { name: 'P.E.K.K.A', kind: 'troop', hp: 3760, damage: 816, hitSpeed: 1.8, loadTime: 0.7, range: 0.8, sight: 5, speed: 0.75, targets: 'ground', r: 0.65, mass: 18 },
  icespirit: { name: 'Ice Spirit', kind: 'troop', hp: 230, damage: 110, hitSpeed: 0.3, loadTime: 0.1, range: 2.5, sight: 5.5, speed: 2.0, targets: 'both', r: 0.35, mass: 1, splash: 1.5, kamikaze: { freeze: 1.2 }, projectile: { speed: 8, kind: 'ice' } },
  witch: { name: 'Witch', kind: 'troop', hp: 838, damage: 134, hitSpeed: 1.1, loadTime: 0.5, range: 5.5, sight: 5.5, speed: 1.0, targets: 'both', r: 0.45, mass: 5, splash: 1.0, projectile: { speed: 10, kind: 'magic' }, spawn: { unit: 'skeleton', count: 4, interval: 7, first: 1 } },
  golem: { name: 'Golem', kind: 'troop', hp: 5120, damage: 312, hitSpeed: 2.5, loadTime: 1.0, range: 0.8, sight: 7, speed: 0.75, targets: 'buildings', r: 0.8, mass: 20, deathDamage: { damage: 312, radius: 2 }, deathSpawn: { unit: 'golemite', count: 2 } },
  golemite: { name: 'Golemite', kind: 'troop', hp: 1040, damage: 63, hitSpeed: 2.5, loadTime: 1.0, range: 0.8, sight: 7, speed: 0.75, targets: 'buildings', r: 0.5, mass: 6, deathDamage: { damage: 63, radius: 2 } },
  barbarian: { name: 'Barbarian', kind: 'troop', hp: 670, damage: 192, hitSpeed: 1.4, loadTime: 0.6, range: 0.8, sight: 5.5, speed: 1.0, targets: 'ground', r: 0.45, mass: 5 },
  bat: { name: 'Bat', kind: 'troop', air: true, hp: 81, damage: 81, hitSpeed: 1.3, loadTime: 0.4, range: 1.2, sight: 5.5, speed: 2.0, targets: 'both', r: 0.3, mass: 1 },
  royalgiant: { name: 'Royal Giant', kind: 'troop', hp: 3164, damage: 307, hitSpeed: 1.7, loadTime: 0.8, range: 5, sight: 7.5, speed: 0.75, targets: 'buildings', r: 0.75, mass: 18, projectile: { speed: 14, kind: 'cannonball' } },

  cannon: { name: 'Cannon', kind: 'building', hp: 824, damage: 212, hitSpeed: 0.9, loadTime: 0.4, range: 5.5, sight: 5.5, speed: 0, targets: 'ground', r: 1.0, mass: 0, lifetime: 30, projectile: { speed: 14, kind: 'cannonball' } },

  // Next point a ground unit should walk to on its way to (gx, gy).
  function nextWaypoint(e, gx, gy) {
    if (e.air || e.def.jumpsRiver) return { x: gx, y: gy };
    var gSide = sideOf(gy);
    if (isRiverY(e.y)) {
      // Already on a bridge: leave by the bank on the goal's side.
      var bx = e.bridgeX !== null ? e.bridgeX : nearestBridge(e.x).x;
      return { x: bx, y: gSide === 0 ? BANK_BOTTOM : BANK_TOP };
    }
    var side = sideOf(e.y);
    if (side === gSide) {
      e.bridgeX = null;
      return { x: gx, y: gy };
    }
    if (e.bridgeX === null) e.bridgeX = chooseBridgeX(e, gx, gy, side);
    var entY = side === 0 ? BANK_BOTTOM : BANK_TOP;
    var exY = side === 0 ? BANK_TOP : BANK_BOTTOM;
    // Once at the entrance, commit to the crossing (one-way switch avoids oscillating at the bank).
    if (dist(e, { x: e.bridgeX, y: entY }) <= 0.6) {
      return { x: e.bridgeX, y: exY };
    }
    return { x: e.bridgeX, y: entY };
  }

  // ---- attacks ----------------------------------------------------------

  // Fires one attack from e at its current target. Melee lands now; ranged spawns a projectile.
  function fire(game, e) {
    var def = e.def;
    var tgt = e.target;
    if (!tgt) return;
    var dmg = def.damage;
    if (def.ramp) dmg = def.ramp.stages[e.rampStage];
    if (e.charging && def.charge) {
      dmg = def.damage * def.charge.damageMult;
      e.charging = false;
    }
    e.chargeDist = 0;
    e.lastAttackT = game.time;
    e.facing = Math.atan2(tgt.y - e.y, tgt.x - e.x);

    if (def.kamikaze) {
      // Ice Spirit: the jump is an instant impact, then the unit is gone.
      splashHit(game, e.team, def.targets, tgt.x, tgt.y, def.splash || 0, dmg, def.kamikaze.freeze);
      game.events.push({ type: 'hit', team: e.team, x: tgt.x, y: tgt.y, cardId: e.cardId });
      killEntity(game, e);
      return;
    }

    if (def.projectile) {
      game.projectiles.push({
        x: e.x,
        y: e.y,
        team: e.team,
        kind: def.projectile.kind,
        target: tgt,
        tx: tgt.x,
        ty: tgt.y,
        speed: def.projectile.speed,
        damage: dmg,
        splash: def.splash || 0,
        targets: def.targets,
        fromTower: e.kind === 'tower',
        done: false,
      });
    } else {
      if (def.splashAroundSelf) {
        splashHit(game, e.team, def.targets, e.x, e.y, def.splash, dmg, 0);
      } else if (def.splash) {
        splashHit(game, e.team, def.targets, tgt.x, tgt.y, def.splash, dmg, 0);
      } else {
        damageEntity(game, tgt, dmg);
      }
      game.events.push({ type: 'hit', team: e.team, x: tgt.x, y: tgt.y, cardId: e.cardId });
      game.effects.push({ type: 'hit', x: tgt.x, y: tgt.y, radius: tgt.r, t: 0, dur: 0.25, team: e.team });
    }
  }

  function updateTower(game, t, dt) {
    if (!t.active) return;
    var def = t.def;
    if (t.target && (t.target.dead || edgeDist(t, t.target) > def.range)) dropTarget(t);
    if (!t.target) {
      setTarget(t, findTarget(game, t, def.range));
      if (!t.target) {
        t.attackCooldown = 0;
        return;
      }
    }
    t.facing = Math.atan2(t.target.y - t.y, t.target.x - t.x);
    t.attackCooldown -= dt;
    if (t.attackCooldown <= 0) {
      fire(game, t);
      t.attackCooldown += def.hitSpeed;
    }
  }

  // ---- per-unit update --------------------------------------------------

  function updateUnit(game, e, dt) {
    var def = e.def;

    if (def.lifetime) {
      e.hp -= (e.maxHp / def.lifetime) * dt;
      if (e.hp <= 0) {
        e.hp = 0;
        killEntity(game, e);
        return;
      }
    }
    if (e.deployT > 0) {
      e.deployT = Math.max(0, e.deployT - dt);
      return;
    }

    e.stunT = Math.max(0, e.stunT - dt);
    e.freezeT = Math.max(0, e.freezeT - dt);
    e.slowT = Math.max(0, e.slowT - dt);
    if (e.slowT === 0) e.slowAmount = 0;
    var disabled = e.stunT > 0 || e.freezeT > 0;

    if (def.spawn) {
      e.spawnTimer -= dt;
      if (e.spawnTimer <= 0) {
        e.spawnTimer += def.spawn.interval;
        var fy = e.y + (e.team === 0 ? -SPAWN_FRONT : SPAWN_FRONT);
        spawnFormation(game, e.team, def.spawn.unit, def.spawn.count, e.x, fy, null);
        game.effects.push({ type: 'spawn', x: e.x, y: fy, radius: 0.8, t: 0, dur: 0.5, team: e.team });
      }
    }

    // Targeting: locked units keep their target; others re-scan every RETARGET_EVERY seconds.
    if (e.target && !canHit(e, e.target)) dropTarget(e);
    if (e.target && e.locked && edgeDist(e, e.target) > def.range + LOCK_BREAK) dropTarget(e);
    e.retargetT -= dt;
    if (!e.locked && e.retargetT <= 0) {
      e.retargetT = RETARGET_EVERY;
      setTarget(e, findTarget(game, e, e.sight));
    }

    if (def.ramp) {
      if (e.target && e.locked && !disabled) {
        e.rampT += dt;
        var st = def.ramp.stageTime;
        e.rampStage = e.rampT >= 2 * st ? 2 : e.rampT >= st ? 1 : 0;
        e.beamTarget = e.target;
      } else {
        e.beamTarget = null;
      }
    }

    var canAttack = def.damage > 0 && def.hitSpeed > 0;
    var inRange = !!e.target && edgeDist(e, e.target) <= def.range + EPS;

    if (!disabled && canAttack && inRange) {
      if (!e.locked) {
        e.locked = true;
        e.attackCooldown = def.loadTime || 0;
      }
      e.chargeDist = 0;
      e.attackCooldown -= dt;
      if (e.attackCooldown <= 0) {
        fire(game, e);
        e.attackCooldown += def.hitSpeed;
      }
      return;
    }

    if (disabled || def.speed <= 0) return;

    var gx = null;
    var gy = null;
    if (e.target) {
      if (!inRange) {
        gx = e.target.x;
        gy = e.target.y;
      }
    } else {
      var g = defaultGoal(game, e);
      if (g) {
        gx = g.x;
        gy = g.y;
      }
    }
    if (gx === null) return;

    var wp = nextWaypoint(e, gx, gy);
    var moved = stepToward(e, wp.x, wp.y, dt, currentSpeed(e));
    if (moved > 0) {
      e.chargeDist += moved;
      if (def.charge && !e.charging && e.chargeDist >= def.charge.dist) e.charging = true;
    }
  }

  // ---- spells -----------------------------------------------------------

  function spellImpact(game, cardId, team, x, y) {
    var card = CARDS[cardId];
    if (card.spawnUnit) {
      spawnFormation(game, team, card.spawnUnit, card.spawnCount || 1, x, y, cardId);
      game.effects.push({ type: 'spawn', x: x, y: y, radius: card.radius || 1, t: 0, dur: 0.5, team: team });
      return;
    }
    var pt = { x: x, y: y, r: 0 };
    var radius = card.radius || 0;
    var list = game.entities.slice();
    for (var i = 0; i < list.length; i++) {
      var en = list[i];
      if (en.dead || en.team === team) continue;
      if (dist(en, pt) > radius + en.r) continue;
      if (en.kind === 'tower') {
        damageEntity(game, en, card.towerDamage || 0);
        continue;
      }
      if (en.air && card.log) continue; // the log only hits ground
      if (card.stun || card.freeze) applyDisable(en, card.stun || 0, card.freeze || 0);
      if (card.knockback && en.kind === 'troop' && !en.air && en.def.mass < 15) {
        knockback(en, en.x - x, en.y - y, card.knockback);
      }
      damageEntity(game, en, card.damage || 0);
    }
    game.effects.push({
      type: EFFECT_FOR_CARD[cardId] || 'hit',
      x: x,
      y: y,
      radius: radius,
      t: 0,
      dur: 0.5,
      team: team,
    });
  }

  function castSpell(game, team, cardId, x, y) {
    var card = CARDS[cardId];
    game.events.push({ type: 'spell', team: team, x: x, y: y, cardId: cardId });
    if (card.log) {
      game.spells.push({
        kind: 'log',
        cardId: cardId,
        team: team,
        x: x,
        y: y,
        sx: x,
        sy: y,
        dir: team === 0 ? -1 : 1,
        traveled: 0,
        length: card.log.length,
        width: card.log.width,
        speed: card.log.speed,
        hit: new Set(),
        done: false,
      });
    } else if (card.duration) {
      game.spells.push({
        kind: 'poison',
        cardId: cardId,
        team: team,
        x: x,
        y: y,
        radius: card.radius,
        remaining: card.duration,
        tickT: 1,
        done: false,
      });
    } else if (card.travelSpeed > 0) {
      var k = kingPos(team);
      game.spells.push({
        kind: 'flying',
        cardId: cardId,
        team: team,
        x: k.x,
        y: k.y,
        tx: x,
        ty: y,
        travelSpeed: card.travelSpeed,
        done: false,
      });
    } else {
      spellImpact(game, cardId, team, x, y);
    }
  }

  function poisonTick(game, s) {
    var card = CARDS[s.cardId];
    var pt = { x: s.x, y: s.y, r: 0 };
    var list = game.entities.slice();
    for (var i = 0; i < list.length; i++) {
      var en = list[i];
      if (en.dead || en.team === s.team) continue;
      if (dist(en, pt) > s.radius + en.r) continue;
      damageEntity(game, en, en.kind === 'tower' ? card.towerDps : card.dps);
    }
  }

  function updateSpells(game, dt) {
    for (var i = 0; i < game.spells.length; i++) {
      var s = game.spells[i];
      if (s.done) continue;
      var card = CARDS[s.cardId];
      if (s.kind === 'flying') {
        var dx = s.tx - s.x;
        var dy = s.ty - s.y;
        var d = Math.hypot(dx, dy);
        var step = s.travelSpeed * dt;
        if (d <= step || d < EPS) {
          s.x = s.tx;
          s.y = s.ty;
          s.done = true;
          spellImpact(game, s.cardId, s.team, s.tx, s.ty);
        } else {
          s.x += (dx / d) * step;
          s.y += (dy / d) * step;
        }
      } else if (s.kind === 'poison') {
        s.remaining -= dt;
        s.tickT -= dt;
        if (s.tickT <= 0) {
          s.tickT += 1;
          poisonTick(game, s);
        }
        var pt = { x: s.x, y: s.y, r: 0 };
        var list = game.entities;
        for (var j = 0; j < list.length; j++) {
          var en = list[j];
          if (en.dead || en.team === s.team || en.kind === 'tower') continue;
          if (dist(en, pt) > s.radius + en.r) continue;
          en.slowT = Math.max(en.slowT, POISON_SLOW_TIME);
          en.slowAmount = card.slow;
        }
        if (s.remaining <= 0) s.done = true;
      } else if (s.kind === 'log') {
        s.traveled = Math.min(s.length, s.traveled + s.speed * dt);
        var front = s.sy + s.dir * s.traveled;
        var targets = game.entities.slice();
        for (var q = 0; q < targets.length; q++) {
          var t = targets[q];
          if (t.dead || t.team === s.team || t.air) continue;
          if (s.hit.has(t.id)) continue;
          if (Math.abs(t.x - s.x) > s.width / 2 + t.r) continue;
          if (Math.abs(t.y - front) > 0.6 + t.r) continue;
          s.hit.add(t.id);
          if (t.kind === 'tower') {
            damageEntity(game, t, card.towerDamage);
          } else {
            if (t.kind === 'troop' && t.def.mass < 15) knockback(t, 0, s.dir, card.knockback);
            damageEntity(game, t, card.damage);
          }
        }
        if (s.traveled >= s.length) s.done = true;
      }
    }
  }

  // ---- projectiles ------------------------------------------------------

  function impactProjectile(game, p) {
    if (p.splash > 0) {
      splashHit(game, p.team, p.targets, p.x, p.y, p.splash, p.damage, 0);
    } else if (p.target && !p.target.dead) {
      damageEntity(game, p.target, p.damage);
    }
    game.events.push({ type: 'hit', team: p.team, x: p.x, y: p.y });
    game.effects.push({ type: 'hit', x: p.x, y: p.y, radius: 0.5, t: 0, dur: 0.3, team: p.team });
  }

  function updateProjectiles(game, dt) {
    for (var i = 0; i < game.projectiles.length; i++) {
      var p = game.projectiles[i];
      if (p.done) continue;
      if (p.target && !p.target.dead) {
        p.tx = p.target.x;
        p.ty = p.target.y;
      }
      var dx = p.tx - p.x;
      var dy = p.ty - p.y;
      var d = Math.hypot(dx, dy);
      var step = p.speed * dt;
      if (d <= Math.max(step, 0.3)) {
        p.x = p.tx;
        p.y = p.ty;
        p.done = true;
        impactProjectile(game, p);
      } else {
        p.x += (dx / d) * step;
        p.y += (dy / d) * step;
      }
    }
  }

  // ---- collisions and bounds -------------------------------------------

  // Pairwise push-apart within the same layer (ground or air). Towers and buildings are immovable.
  function resolveCollisions(game) {
    var list = game.entities;
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < list.length; i++) {
        var a = list[i];
        if (a.dead) continue;
        for (var j = i + 1; j < list.length; j++) {
          var b = list[j];
          if (b.dead) continue;
          if (a.kind !== 'troop' && b.kind !== 'troop') continue;
          if (a.air !== b.air) continue;
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var minD = a.r + b.r;
          var d2 = dx * dx + dy * dy;
          if (d2 >= minD * minD) continue;
          var d = Math.sqrt(d2);
          var nx = 1;
          var ny = 0;
          if (d >= EPS) {
            nx = dx / d;
            ny = dy / d;
          } else {
            d = 0;
          }
          var overlap = minD - d;
          var aFixed = a.kind !== 'troop';
          var bFixed = b.kind !== 'troop';
          var fa;
          var fb;
          if (aFixed) {
            fa = 0;
            fb = 1;
          } else if (bFixed) {
            fa = 1;
            fb = 0;
          } else {
            var ma = a.def.mass;
            var mb = b.def.mass;
            fa = mb / (ma + mb);
            fb = ma / (ma + mb);
          }
          a.x -= nx * overlap * fa;
          a.y -= ny * overlap * fa;
          b.x += nx * overlap * fb;
          b.y += ny * overlap * fb;
        }
      }
      for (i = 0; i < list.length; i++) {
        var e = list[i];
        if (e.dead || e.kind === 'tower') continue;
        riverClamp(e);
        arenaClamp(e);
      }
    }
  }

  // ---- match phases and cleanup ----------------------------------------

  function lowestTowerHp(game, team) {
    var m = Infinity;
    for (var i = 0; i < game.entities.length; i++) {
      var t = game.entities[i];
      if (!t.dead && t.kind === 'tower' && t.team === team && t.hp < m) m = t.hp;
    }
    return m === Infinity ? 0 : m;
  }

  function updatePhase(game) {
    if (game.phase === 'regulation') {
      game.timeLeft = Math.max(0, MATCH.regulation - game.time);
      game.elixirMult = game.time >= MATCH.regulation - MATCH.doubleAt ? 2 : 1;
      if (game.time >= MATCH.regulation) {
        var c0 = game.players[0].crowns;
        var c1 = game.players[1].crowns;
        if (c0 !== c1) {
          endGame(game, c0 > c1 ? 0 : 1, 'crowns');
        } else {
          game.phase = 'overtime';
          game.overtimeStart = game.time;
          game.timeLeft = MATCH.overtime;
          game.elixirMult = 2;
        }
      }
    }
    if (game.phase === 'overtime') {
      var el = game.time - game.overtimeStart;
      game.timeLeft = Math.max(0, MATCH.overtime - el);
      game.elixirMult = el < MATCH.overtime / 2 ? 2 : 3;
      if (el >= MATCH.overtime) {
        var h0 = lowestTowerHp(game, 0);
        var h1 = lowestTowerHp(game, 1);
        if (h0 === h1) endGame(game, -1, 'draw');
        else endGame(game, h0 < h1 ? 1 : 0, 'tiebreak');
      }
    }
  }

  function ageEffects(game, dt) {
    for (var i = 0; i < game.effects.length; i++) game.effects[i].t += dt;
    game.effects = game.effects.filter(function (f) {
      return f.t < f.dur;
    });
  }

  // Removes dead entities and finished projectiles/spells, and drops references to dead targets.
  function cleanup(game) {
    game.entities = game.entities.filter(function (e) {
      return !e.dead;
    });
    for (var i = 0; i < game.entities.length; i++) {
      var e = game.entities[i];
      if (e.target && e.target.dead) {
        e.target = null;
        e.locked = false;
        e.retargetT = 0;
      }
      if (e.beamTarget && e.beamTarget.dead) e.beamTarget = null;
    }
    game.projectiles = game.projectiles.filter(function (p) {
      if (p.target && p.target.dead) p.target = null;
      return !p.done;
    });
    game.spells = game.spells.filter(function (s) {
      return !s.done;
    });
  }

  // ---- players and deploy zone -----------------------------------------

  function makePlayer(game, deckIn) {
    if (!deckIn || deckIn.length < 5) throw new Error('A deck needs at least 5 cards');
    var deck = deckIn.slice();
    for (var i = 0; i < deck.length; i++) {
      if (!CARDS[deck[i]]) throw new Error('Unknown card: ' + deck[i]);
    }
    for (i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(game.rng() * (i + 1));
      var tmp = deck[i];
      deck[i] = deck[j];
      deck[j] = tmp;
    }
    return {
      elixir: ELIXIR.start,
      crowns: 0,
      deck: deck,
      hand: deck.slice(0, 4),
      next: deck[4],
      queue: deck.slice(5),
    };
  }

  // Pocket: once the enemy princess tower in the point's lane is gone, the point may be on the enemy side.
  function inPocket(game, team, x, y) {
    var lane = x < LANE_SPLIT ? 0 : 1;
    if (findTower(game, 1 - team, 'princess', lane)) return false;
    if (team === 0) return y >= RIVER_TOP - POCKET_REACH && y <= RIVER_TOP;
    return y >= RIVER_BOTTOM && y <= RIVER_BOTTOM + POCKET_REACH;
  }

  // ---- public API -------------------------------------------------------

  class Game {
    constructor(opts) {
      opts = opts || {};
      var decks = opts.decks || [CR.DEFAULT_DECK, CR.DEFAULT_DECK];
      this.seed = opts.seed === undefined ? 1 : opts.seed;
      this.rng = mulberry32(this.seed);
      this.nextId = 1;
      this.time = 0;
      this.phase = 'regulation';
      this.timeLeft = MATCH.regulation;
      this.elixirMult = 1;
      this.overtimeStart = 0;
      this.entities = [];
      this.projectiles = [];
      this.spells = [];
      this.effects = [];
      this.events = [];
      this.result = null;
      this.players = [makePlayer(this, decks[0]), makePlayer(this, decks[1])];
      for (var t = 0; t < 2; t++) this._spawnTowers(t);
    }

    _spawnTowers(team) {
      var L = TOWERS.layout;
      for (var k = 0; k < L.length; k++) {
        var entry = L[k];
        var pos = towerLayoutPos(team, entry);
        this.entities.push(
          makeEntity(this, {
            team: team,
            kind: 'tower',
            unitId: entry.type,
            towerType: entry.type,
            lane: entry.lane,
            x: pos.x,
            y: pos.y,
            def: towerDef(entry.type),
            deployT: 0,
            active: entry.type !== 'king',
          })
        );
      }
    }

    update(dt) {
      this.events = [];
      if (!isNum(dt) || dt <= 0) return;
      if (this.phase === 'ended') {
        ageEffects(this, dt);
        cleanup(this);
        return;
      }
      this.time += dt;
      updatePhase(this);
      if (this.phase !== 'ended') {
        for (var t = 0; t < 2; t++) {
          var p = this.players[t];
          p.elixir = Math.min(ELIXIR.max, p.elixir + (dt * this.elixirMult) / ELIXIR.regen);
        }
        var list = this.entities.slice();
        for (var i = 0; i < list.length; i++) {
          var e = list[i];
          if (e.dead) continue;
          if (e.kind === 'tower') updateTower(this, e, dt);
          else updateUnit(this, e, dt);
          if (this.phase === 'ended') break;
        }
      }
      if (this.phase !== 'ended') {
        updateSpells(this, dt);
        updateProjectiles(this, dt);
        resolveCollisions(this);
      }
      ageEffects(this, dt);
      cleanup(this);
    }

    isInDeployZone(team, cardId, x, y) {
      var card = CARDS[cardId];
      if (!card || !isNum(x) || !isNum(y)) return false;
      if (x < 0 || x > W || y < 0 || y > H) return false;
      if (card.type === 'spell') return true;
      var own = team === 0 ? y >= RIVER_BOTTOM : y <= RIVER_TOP;
      if (!own && !inPocket(this, team, x, y)) return false;
      for (var i = 0; i < this.entities.length; i++) {
        var t = this.entities[i];
        if (t.dead || t.kind !== 'tower') continue;
        var half = t.size / 2;
        if (Math.abs(x - t.x) < half && Math.abs(y - t.y) < half) return false;
      }
      return true;
    }

    canDeploy(team, handIndex, x, y) {
      var p = this.players[team];
      if (!p || this.phase === 'ended') return false;
      if (!(Number.isInteger(handIndex) && handIndex >= 0 && handIndex < p.hand.length)) return false;
      if (!isNum(x) || !isNum(y)) return false;
      var cardId = p.hand[handIndex];
      var card = CARDS[cardId];
      if (!card || p.elixir + 1e-9 < card.cost) return false;
      return this.isInDeployZone(team, cardId, clamp(x, 0, W), clamp(y, 0, H));
    }

      this._drawSpells(game, time);
      this._drawEffects(game);
      if (uiState.drag && sel >= 0 && cd) this._drawDragGhost(game, team, uiState, cardId, cd);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    this._uiXform();
    this._drawTopBar(game, team);
    this._drawPanel(game, team, uiState);

    if (game && uiState.drag && sel >= 0 && cd && !this.isInArena(uiState.drag.x, uiState.drag.y)) {
      var rect = this.cardRects[sel];
      var w = rect.w * 1.1;
      var h = rect.h * 1.1;
      this._card(cardId, uiState.drag.x - w / 2, uiState.drag.y - h / 2, w, h, { selected: true });
    }
  };

  // ---------- towers ----------

  Renderer.prototype._trackTowers = function (game) {
    var ents = game.entities || [];
    if (this._towerGame !== game || (game.time || 0) < this._towerTime) {
      this._towerGame = game;
      this._towers = {};
    }
    this._towerTime = game.time || 0;
    var seen = {};
    for (var i = 0; i < ents.length; i++) {
      var e = ents[i];
      if (!e || e.kind !== 'tower') continue;
      var key = towerKey(e);
      seen[key] = true;
      var rec = this._towers[key];
      if (!rec) {
        var type = e.towerType || (e.unitId === 'king' ? 'king' : 'princess');
        rec = this._towers[key] = { type: type, size: towerSize(type) };
      }
      rec.x = e.x;
      rec.y = e.y;
      rec.team = e.team;
      rec.alive = entAlive(e);
    }
    for (var k in this._towers) {
      if (!seen[k]) this._towers[k].alive = false;
    }
  };

  Renderer.prototype._drawRubble = function () {
    var ctx = this.ctx;
    for (var k in this._towers) {
      var r = this._towers[k];
      if (r.alive || r.x == null) continue;
      var rad = r.size * 0.42;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, rad * 1.1, rad * 0.75, 0, 0, TAU);
      ctx.fillStyle = 'rgba(40,40,40,0.35)';
      ctx.fill();
      ctx.fillStyle = '#5f5f5f';
      ctx.beginPath();
      ctx.arc(r.x, r.y, rad * 0.5, 0, TAU);
      ctx.fill();
      for (var s = 0; s < 6; s++) {
        var a = s * (TAU / 6) + 0.4;
        var sx = r.x + Math.cos(a) * rad * 0.7;
        var sy = r.y + Math.sin(a) * rad * 0.55;
        ctx.beginPath();
        ctx.arc(sx, sy, 0.22, 0, TAU);
        ctx.fillStyle = s % 2 ? '#9a9a9a' : '#7d7d7d';
        ctx.fill();
        ctx.lineWidth = 0.05;
        ctx.strokeStyle = '#3f3f3f';
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  };

  // Splits entities into ground (towers, buildings, ground troops) and air buffers, sorted by y.
  Renderer.prototype._sortEntities = function (ents) {
    var g = this._gBuf;
    var a = this._aBuf;
    g.length = 0;
    a.length = 0;
    ents = ents || [];
    for (var i = 0; i < ents.length; i++) {
      var e = ents[i];
      if (!e || e.dead) continue;
      if (e.kind === 'tower') {
        if (entAlive(e)) g.push(e);
        continue;
      }
      if (!entAlive(e)) continue;
      if (e.kind === 'building') g.push(e);
      else if (e.air) a.push(e);
      else g.push(e);
    }
    g.sort(byY);
    a.sort(byY);
  };

  // ---------- arena layers ----------

  Renderer.prototype._drawRipples = function (time) {
    var ctx = this.ctx;
    var cfg = this._cfg;
    var rt = cfg.RIVER_TOP;
    var rb = cfg.RIVER_BOTTOM;
    ctx.beginPath();
    ctx.strokeStyle = COL.ripple;
    ctx.lineWidth = 0.06;
    ctx.lineCap = 'round';
    for (var i = 0; i < 12; i++) {
      var sp = 0.5 + (i % 4) * 0.18;
      var x = ((i * 2.37 + time * sp) % (W + 2)) - 1;
      var y = rt + 0.3 + ((i * 0.618) % 1) * (rb - rt - 0.6);
      if (overBridge(cfg, x)) continue;
      var len = 0.7 + (i % 3) * 0.25;
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + len / 2, y - 0.14, x + len, y);
    }
    ctx.stroke();
    ctx.lineCap = 'butt';
  };

  Renderer.prototype._deployGrid = function (game, team, cardId) {
    var fn = game.isInDeployZone;
    if (typeof fn !== 'function') return null;
    var key = team + '|' + cardId;
    var now = nowMs();
    if (this._dzGame === game && this._dzKey === key && now - this._dzAt < DEPLOY_CACHE_MS) {
      return this._dz;
    }
    var dz = this._dz;
    for (var j = 0; j < H; j++) {
      for (var i = 0; i < W; i++) {
        dz[j * W + i] = fn.call(game, team, cardId, i + 0.5, j + 0.5) ? 1 : 0;
      }
    }
    this._dzGame = game;
    this._dzKey = key;
    this._dzAt = now;
    return dz;
  };

  Renderer.prototype._drawDeployZone = function (game, team, cardId) {
    var dz = this._deployGrid(game, team, cardId);
    if (!dz) return;
    var ctx = this.ctx;
    ctx.beginPath();
    for (var j = 0; j < H; j++) {
      for (var i = 0; i < W; i++) {
        if (!dz[j * W + i]) ctx.rect(i, j, 1, 1);
      }
    }
    ctx.fillStyle = COL.invalid;
    ctx.fill();
  };

  Renderer.prototype._drawShadows = function () {
    var ctx = this.ctx;
    var g = this._gBuf;
    var a = this._aBuf;
    ctx.beginPath();
    ctx.fillStyle = COL.shadow;
    var i, e, r;
    for (i = 0; i < g.length; i++) {
      e = g[i];
      if (e.kind === 'tower') continue;
      r = radiusOf(e);
      ctx.moveTo(e.x + r * 0.95, e.y + r * 0.3);
      ctx.ellipse(e.x, e.y + r * 0.3, r * 0.95, r * 0.5, 0, 0, TAU);
    }
    for (i = 0; i < a.length; i++) {
      e = a[i];
      r = radiusOf(e);
      ctx.moveTo(e.x + r * 0.95, e.y + r * 0.3);
      ctx.ellipse(e.x, e.y + r * 0.3, r * 0.95, r * 0.5, 0, 0, TAU);
    }
    ctx.fill();
  };

  Renderer.prototype._drawGroundStack = function () {
    var g = this._gBuf;
    for (var i = 0; i < g.length; i++) {
      var e = g[i];
      if (e.kind === 'tower') this._drawTower(e);
      else if (e.kind === 'building') this._drawBody(e, 0, true, 1.3, true);
      else this._drawBody(e, 0, false, 1.5, false);
    }
    this.ctx.globalAlpha = 1;
  };

  Renderer.prototype._drawAir = function () {
    var a = this._aBuf;
    for (var i = 0; i < a.length; i++) {
      this._drawBody(a[i], 0.6, false, 1.5, false);
    }
    this.ctx.globalAlpha = 1;
  };

  // Shared body drawing for troops and buildings.
  Renderer.prototype._drawBody = function (e, lift, square, emojiK, alwaysBar) {
    var ctx = this.ctx;
    var time = this._time;
    var r = radiusOf(e);
    var team = teamColor(e.team);
    var x = e.x;
    var y = e.y - lift;

    // Lunge toward the target for a short time after an attack.
    var age = e.lastAttackT != null ? time - e.lastAttackT : -1;
    if (age >= 0 && age < LUNGE_T && e.target && typeof e.target === 'object') {
      var dx = e.target.x - e.x;
      var dy = e.target.y - e.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > 0.01) {
        var amt = Math.min(0.25, r * 0.5) * Math.sin((Math.PI * age) / LUNGE_T);
        x += (dx / d) * amt;
        y += (dy / d) * amt;
      }
    }

    var deploying = e.deployT > 0;
    var frozen = e.freezeT > 0;
    ctx.globalAlpha = deploying ? 0.5 : 1;

    if (square) {
      rrPath(ctx, x - r, y - r, r * 2, r * 2, r * 0.3);
    } else {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
    }
    ctx.fillStyle = frozen ? COL.ice : team.main;
    ctx.fill();
    ctx.lineWidth = Math.max(0.05, r * 0.16);
    ctx.strokeStyle = frozen ? '#3d7fb0' : team.dark;
    ctx.stroke();

    this._emoji(unitEmoji(e.unitId), x, y, Math.max(0.36, emojiK * r));

    if (e.charging) {
      var facing = typeof e.facing === 'number' ? e.facing : e.team === 1 ? Math.PI / 2 : -Math.PI / 2;
      var bx = Math.cos(facing + Math.PI);
      var by = Math.sin(facing + Math.PI);
      var px = -by;
      var py = bx;
      ctx.beginPath();
      for (var k = -1; k <= 1; k++) {
        var o = k * 0.22;
        var sx = x + bx * (r + 0.08) + px * o;
        var sy = y + by * (r + 0.08) + py * o;
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + bx * 0.55, sy + by * 0.55);
      }
      ctx.lineWidth = 0.06;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.stroke();
    }

    if (e.stunT > 0) {
      ctx.fillStyle = '#ffe83a';
      for (var s = 0; s < 3; s++) {
        var a = time * 7 + (s * TAU) / 3;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * r * 0.9, y - r * 0.9 - 0.12 + Math.sin(a * 1.3) * 0.08, 0.07, 0, TAU);
        ctx.fill();
      }
    }

    if (deploying) {
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(x, y, r + 0.14, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(e.deployT, 0, 1));
      ctx.lineWidth = 0.08;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    ctx.globalAlpha = deploying ? 0.5 : 1;
    if (e.maxHp > 0 && e.hp > 0 && (alwaysBar || e.hp < e.maxHp)) {
      var bw = square ? r * 2.4 : Math.max(0.7, r * 2.2);
      this._bar(x, y - r - 0.34, bw, e.hp / e.maxHp, team.main);
    }
    ctx.globalAlpha = 1;
  };

  Renderer.prototype._drawTower = function (e) {
    var ctx = this.ctx;
    var type = e.towerType || (e.unitId === 'king' ? 'king' : 'princess');
    var size = towerSize(type);
    var half = size / 2;
    var x = e.x;
    var y = e.y;
    var team = teamColor(e.team);
    var sign = e.team === 1 ? 1 : -1;
    var active = type !== 'king' || e.active !== false;
    ctx.globalAlpha = active ? 1 : 0.65;

    // Crenellations on the top and bottom edges, then the stone block.
    ctx.fillStyle = COL.stone;
    ctx.strokeStyle = COL.stoneEdge;
    ctx.lineWidth = 0.08;
    var i;
    for (i = 0; i < size; i++) {
      var mx = x - half + i + 0.2;
      ctx.fillRect(mx, y - half - 0.3, 0.6, 0.34);
      ctx.strokeRect(mx, y - half - 0.3, 0.6, 0.34);
      ctx.fillRect(mx, y + half - 0.04, 0.6, 0.34);
      ctx.strokeRect(mx, y + half - 0.04, 0.6, 0.34);
    }
    ctx.fillRect(x - half, y - half, size, size);
    ctx.strokeRect(x - half, y - half, size, size);

    var roof = size - (type === 'king' ? 1.2 : 1.0);
    rrPath(ctx, x - roof / 2, y - roof / 2, roof, roof, 0.25);
    ctx.fillStyle = team.main;
    ctx.fill();
    ctx.lineWidth = 0.1;
    ctx.strokeStyle = team.dark;
    ctx.stroke();

    if (type === 'king') {
      this._emoji('👑', x, y, 1.25);
    } else {
      this._emoji('🏹', x, y, 0.95);
    }

    if (!active) {
      arenaText(ctx, 'z', x + half * 0.8, y - half * 0.8, 0.7, '#ffffff', { bold: true, outline: '#222' });
    }

    // Health bar on the side facing the player's own edge is drawn on the enemy side (outside the arena top).
    var maxHp = e.maxHp > 0 ? e.maxHp : 1;
    var frac = e.hp / maxHp;
    var bw = size * 0.95;
    var barY = sign < 0 ? y - half - 0.5 : y + half + 0.2;
    this._bar(x, barY, bw, frac, team.main);
    var txt = String(Math.max(0, Math.ceil(e.hp || 0)));
    if (sign < 0) {
      arenaText(ctx, txt, x, barY - 0.08, 0.42, COL.text, { bold: true, outline: 'rgba(0,0,0,0.7)', baseline: 'bottom' });
    } else {
      arenaText(ctx, txt, x, barY + 0.14 + 0.08, 0.42, COL.text, { bold: true, outline: 'rgba(0,0,0,0.7)', baseline: 'top' });
    }
    ctx.globalAlpha = 1;
  };

  Renderer.prototype._drawBeams = function () {
    var ctx = this.ctx;
    var g = this._gBuf;
    for (var i = 0; i < g.length; i++) {
      var e = g[i];
      if (e.kind !== 'building' || typeof e.beamTarget !== 'object' || !e.beamTarget) continue;
      var t = e.beamTarget;
      var lift = t.air ? 0.6 : 0;
      var stage = e.rampStage | 0;
      var w = 0.12 + 0.08 * stage;
      var outer = stage >= 2 ? '#ff3b1f' : stage === 1 ? '#ff6a2a' : '#ff8a3a';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(t.x, t.y - lift);
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = outer;
      ctx.lineWidth = w + 0.1;
      ctx.stroke();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = '#ffe27a';
      ctx.lineWidth = w * 0.45;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineCap = 'butt';
  };

  Renderer.prototype._drawProjectiles = function (game) {
    var list = game.projectiles;
    if (!list || !list.length) return;
    var ctx = this.ctx;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!p) continue;
      var dx;
      var dy;
      var tgt = p.target;
      if (tgt && typeof tgt === 'object' && tgt.x !== undefined) {
        dx = tgt.x - p.x;
        dy = tgt.y - p.y;
      } else {
        dx = (p.tx != null ? p.tx : p.x) - p.x;
        dy = (p.ty != null ? p.ty : p.y) - p.y;
      }
      var ang = Math.atan2(dy, dx);
      if (!isFinite(ang)) ang = 0;
      var c = Math.cos(ang);
      var s = Math.sin(ang);
      var x = p.x;
      var y = p.y;
      ctx.globalAlpha = 1;
      switch (p.kind) {
        case 'arrow':
          ctx.beginPath();
          ctx.moveTo(x - c * 0.3, y - s * 0.3);
          ctx.lineTo(x + c * 0.3, y + s * 0.3);
          ctx.lineWidth = 0.07;
          ctx.strokeStyle = '#4d3418';
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x + c * 0.3, y + s * 0.3, 0.06, 0, TAU);
          ctx.fillStyle = '#c9ced6';
          ctx.fill();
          break;
        case 'bullet':
          ctx.beginPath();
          ctx.arc(x, y, 0.09, 0, TAU);
          ctx.fillStyle = '#1d1d22';
          ctx.fill();
          break;
        case 'cannonball':
          ctx.beginPath();
          ctx.arc(x, y, 0.22, 0, TAU);
          ctx.fillStyle = '#15151a';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x - 0.07, y - 0.07, 0.06, 0, TAU);
          ctx.fillStyle = '#5a5a66';
          ctx.fill();
          break;
        case 'fire':
          ctx.beginPath();
          ctx.arc(x, y, 0.34, 0, TAU);
          ctx.fillStyle = 'rgba(255,120,30,0.45)';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, 0.2, 0, TAU);
          ctx.fillStyle = '#ffb22e';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, 0.08, 0, TAU);
          ctx.fillStyle = '#fff3b0';
          ctx.fill();
          break;
        case 'goo':
          ctx.beginPath();
          ctx.arc(x, y, 0.2, 0, TAU);
          ctx.fillStyle = '#9a4fd8';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x - c * 0.12, y - s * 0.12, 0.08, 0, TAU);
          ctx.fillStyle = '#b97cf0';
          ctx.fill();
          break;
        case 'spear':
          ctx.beginPath();
          ctx.moveTo(x - c * 0.4, y - s * 0.4);
          ctx.lineTo(x + c * 0.4, y + s * 0.4);
          ctx.lineWidth = 0.08;
          ctx.strokeStyle = '#7a5226';
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x + c * 0.4, y + s * 0.4, 0.07, 0, TAU);
          ctx.fillStyle = '#c9ced6';
          ctx.fill();
          break;
        case 'bomb':
          ctx.beginPath();
          ctx.arc(x, y, 0.2, 0, TAU);
          ctx.fillStyle = '#202024';
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(x, y - 0.2);
          ctx.lineTo(x + 0.08, y - 0.32);
          ctx.lineWidth = 0.05;
          ctx.strokeStyle = '#8a6a3a';
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x + 0.08, y - 0.32, 0.05, 0, TAU);
          ctx.fillStyle = '#ffb020';
          ctx.fill();
          break;
        case 'magic':
          ctx.beginPath();
          ctx.arc(x, y, 0.3, 0, TAU);
          ctx.fillStyle = 'rgba(255,110,210,0.4)';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, 0.16, 0, TAU);
          ctx.fillStyle = '#ff8ad8';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, 0.05, 0, TAU);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          break;
        case 'ice':
          ctx.beginPath();
          ctx.arc(x, y, 0.26, 0, TAU);
          ctx.fillStyle = 'rgba(160,230,255,0.5)';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, 0.14, 0, TAU);
          ctx.fillStyle = '#c7f1ff';
          ctx.fill();
          break;
        default:
          ctx.beginPath();
          ctx.arc(x, y, 0.1, 0, TAU);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
      }
    }
  };

  Renderer.prototype._drawSpells = function (game, time) {
    var list = game.spells;
    if (!list || !list.length) return;
    var ctx = this.ctx;
    for (var i = 0; i < list.length; i++) {
      var sp = list[i];
      if (!sp) continue;
      var card = cardDef(sp.cardId) || {};
      ctx.globalAlpha = 1;
      if (sp.kind === 'poison') {
        var rad = sp.radius || card.radius || 3.5;
        var pulse = 0.5 + 0.5 * Math.sin(time * 4 + sp.x + sp.y);
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, rad, 0, TAU);
        ctx.fillStyle = 'rgba(120,220,70,' + (0.22 + 0.06 * pulse).toFixed(3) + ')';
        ctx.fill();
        ctx.lineWidth = 0.1;
        ctx.strokeStyle = 'rgba(90,180,40,0.8)';
        ctx.stroke();
        ctx.fillStyle = 'rgba(200,255,150,0.6)';
        for (var k = 0; k < 4; k++) {
          var a = time * 0.5 + k * 1.57;
          ctx.beginPath();
          ctx.arc(sp.x + Math.cos(a) * rad * 0.6, sp.y + Math.sin(a) * rad * 0.6, 0.12, 0, TAU);
          ctx.fill();
        }
      } else if (sp.kind === 'log') {
        var lg = card.log || {};
        var w = lg.width || 3.9;
        var th = 0.9;
        var x0 = sp.x - w / 2;
        var y0 = sp.y - th / 2;
        rrPath(ctx, x0, y0, w, th, th / 2);
        ctx.fillStyle = '#8b5a2b';
        ctx.fill();
        ctx.lineWidth = 0.07;
        ctx.strokeStyle = '#4e2f14';
        ctx.stroke();
        // Bark marks slide along the log to suggest rolling.
        var phase = (time * (lg.speed || 4.6)) % 1.0;
        ctx.beginPath();
        for (var m = 0; m < 4; m++) {
          var mx = x0 + ((m + phase) * w) / 4;
          ctx.moveTo(mx, y0 + 0.12);
          ctx.lineTo(mx, y0 + th - 0.12);
        }
        ctx.lineWidth = 0.06;
        ctx.strokeStyle = '#c08a52';
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.ellipse(sp.x, sp.y, 0.42, 0.2, 0, 0, TAU);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fill();
        this._emoji(card.emoji || '?', sp.x, sp.y - 0.7, 1.0);
      }
    }
    ctx.globalAlpha = 1;
  };

  Renderer.prototype._drawEffects = function (game) {
    var list = game.effects;
    if (!list || !list.length) return;
    var ctx = this.ctx;
    for (var i = 0; i < list.length; i++) {
      var f = list[i];
      if (!f) continue;
      var dur = f.dur > 0 ? f.dur : 0.5;
      var t = f.t || 0;
      var p = clamp(t / dur, 0, 1);
      var a = 1 - p;
      var R = f.radius > 0 ? f.radius : 0.6;
      var x = f.x;
      var y = f.y;
      var k;
      ctx.save();
      ctx.globalAlpha = a;
      switch (f.type) {
        case 'hit':
          ctx.beginPath();
          ctx.arc(x, y, 0.2 + R * p, 0, TAU);
          ctx.lineWidth = 0.1 * a + 0.03;
          ctx.strokeStyle = '#fff3b0';
          ctx.stroke();
          break;
        case 'splash':
          ctx.beginPath();
          ctx.arc(x, y, R * (0.3 + 0.7 * p), 0, TAU);
          ctx.fillStyle = 'rgba(255,160,60,0.25)';
          ctx.fill();
          ctx.lineWidth = 0.12;
          ctx.strokeStyle = '#ff9a3c';
          ctx.stroke();
          break;
        case 'death':
          ctx.beginPath();
          ctx.arc(x, y, 0.25 + R * 0.6 * p, 0, TAU);
          ctx.fillStyle = 'rgba(230,230,230,0.6)';
          ctx.fill();
          ctx.lineWidth = 0.06;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
          break;
        case 'zap': {
          var flick = Math.floor(t * 30);
          var seed = f.seed != null ? f.seed : i;
          ctx.lineJoin = 'round';
          for (var pass = 0; pass < 2; pass++) {
            ctx.beginPath();
            for (var b = 0; b < 3; b++) {
              var ang = b * (TAU / 3) + seed * 0.7 + flick * 0.9;
              for (k = 0; k <= 4; k++) {
                var dist = R * (k / 4) * 0.95;
                var jit = Math.sin(flick * 12.9 + b * 4.1 + k * 2.7) * 0.22 * (k % 2 ? 1 : -1);
                var px = x + Math.cos(ang) * dist - Math.sin(ang) * jit;
                var py = y + Math.sin(ang) * dist + Math.cos(ang) * jit;
                if (k === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
              }
            }
            ctx.lineWidth = pass === 0 ? 0.14 : 0.05;
            ctx.strokeStyle = pass === 0 ? '#7fdcff' : '#ffffff';
            ctx.stroke();
          }
          break;
        }
        case 'arrows':
          ctx.beginPath();
          for (k = 0; k < 8; k++) {
            var aa = k * 2.4 + 0.3;
            var dd = R * (0.3 + 0.6 * (((k * 37) % 10) / 10));
            var sx = x + Math.cos(aa) * dd;
            var sy = y + Math.sin(aa) * dd * 0.7;
            var fall = (1 - p) * 2.5;
            ctx.moveTo(sx, sy - fall - 0.6);
            ctx.lineTo(sx, sy - fall);
          }
          ctx.lineWidth = 0.07;
          ctx.strokeStyle = '#5a3a1a';
          ctx.stroke();
          break;
        case 'fireball':
        case 'rocket':
          ctx.beginPath();
          ctx.arc(x, y, R * (0.4 + 0.6 * p), 0, TAU);
          ctx.fillStyle = 'rgba(255,130,30,0.7)';
          ctx.fill();
          ctx.lineWidth = 0.12;
          ctx.strokeStyle = '#ff6a1a';
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x, y, R * 0.5 * (1 - p) + 0.1, 0, TAU);
          ctx.fillStyle = '#ffe066';
          ctx.fill();
          break;
        case 'freeze':
          ctx.beginPath();
          ctx.arc(x, y, R, 0, TAU);
          ctx.fillStyle = 'rgba(170,230,255,0.45)';
          ctx.fill();
          ctx.lineWidth = 0.1;
          ctx.strokeStyle = '#e8fbff';
          ctx.stroke();
          ctx.beginPath();
          for (k = 0; k < 6; k++) {
            var fa = k * (TAU / 6);
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(fa) * R * 0.8, y + Math.sin(fa) * R * 0.8);
          }
          ctx.lineWidth = 0.05;
          ctx.stroke();
          break;
        case 'poison':
          ctx.beginPath();
          ctx.arc(x, y, R, 0, TAU);
          ctx.fillStyle = 'rgba(120,220,70,0.3)';
          ctx.fill();
          break;
        case 'deploy':
          ctx.beginPath();
          ctx.arc(x, y, R * (0.5 + 0.8 * p), 0, TAU);
          ctx.lineWidth = 0.1;
          ctx.strokeStyle = '#d9c9a0';
          ctx.stroke();
          break;
        case 'towerDown':
          ctx.beginPath();
          ctx.arc(x, y, R * (0.35 + 0.65 * p), 0, TAU);
          ctx.fillStyle = 'rgba(255,157,60,0.7)';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y - 0.3, R * (0.5 + 0.4 * p), 0, TAU);
          ctx.globalAlpha = a * 0.5;
          ctx.fillStyle = '#5a5a5a';
          ctx.fill();
          ctx.globalAlpha = a;
          ctx.beginPath();
          ctx.arc(x, y, R * 0.3 * (1 - p), 0, TAU);
          ctx.fillStyle = '#fff1a6';
          ctx.fill();
          ctx.beginPath();
          for (k = 0; k < 6; k++) {
            var da = k * (TAU / 6) + 0.2;
            var dr = R * p * 0.9;
            ctx.moveTo(x + Math.cos(da) * dr + 0.12, y + Math.sin(da) * dr);
            ctx.arc(x + Math.cos(da) * dr, y + Math.sin(da) * dr, 0.12, 0, TAU);
          }
          ctx.fillStyle = '#6e5a4a';
          ctx.fill();
          break;
        case 'spawn':
          ctx.fillStyle = '#ffffff';
          for (k = 0; k < 3; k++) {
            var sa = k * (TAU / 3);
            var sd = 0.1 + 0.35 * p;
            ctx.beginPath();
            ctx.arc(x + Math.cos(sa) * sd, y + Math.sin(sa) * sd, 0.25 * (1 - p) + 0.12, 0, TAU);
            ctx.globalAlpha = a * 0.7;
            ctx.fill();
          }
          break;
        case 'elixir':
          arenaText(ctx, String(f.text || '-'), x, y - 1.6 * p, 0.9, '#d98bff', {
            bold: true,
            outline: '#2b0d40'
          });
          break;
        default:
          break;
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  };

  Renderer.prototype._drawDragGhost = function (game, team, uiState, cardId, card) {
    var d = uiState.drag;
    if (!d || !this.isInArena(d.x, d.y)) return;
    var t = this.screenToTile(d.x, d.y);
    var sx = Math.round(t.x * 2) / 2;
    var sy = Math.round(t.y * 2) / 2;
    var ok = true;
    if (typeof game.canDeploy === 'function') {
      ok = !!game.canDeploy(team, uiState.selected, sx, sy);
    }
    var tc = teamColor(team);
    var ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = 0.5;
    if (card.type === 'spell') {
      if (card.log) {
        var w = card.log.width || 3.9;
        var L = card.log.length || 11;
        // Team 0 rolls toward smaller y, team 1 toward larger y.
        var ry = team === 1 ? sy : sy - L;
        ctx.fillStyle = ok ? 'rgba(255,255,255,0.25)' : COL.invalid;
        ctx.fillRect(sx - w / 2, ry, w, L);
        ctx.lineWidth = 0.08;
        ctx.strokeStyle = ok ? '#ffffff' : COL.invalidSolid;
        ctx.strokeRect(sx - w / 2, ry, w, L);
      } else {
        var rad = card.radius || 1.5;
        ctx.beginPath();
        ctx.arc(sx, sy, rad, 0, TAU);
        ctx.fillStyle = ok ? 'rgba(255,255,255,0.22)' : COL.invalid;
        ctx.fill();
        ctx.lineWidth = 0.08;
        ctx.setLineDash([0.15, 0.15]);
        ctx.strokeStyle = ok ? '#ffffff' : COL.invalidSolid;
        ctx.stroke();
        ctx.setLineDash([]);
      }
    } else {
      var def = unitDef(card.unit) || {};
      var r = def.r || 0.5;
      var building = card.type === 'building';
      var offs = formation(card.count || 1);
      var col = ok ? tc.main : COL.invalidSolid;
      for (var i = 0; i < offs.length; i++) {
        var px = sx + offs[i][0];
        var py = sy + offs[i][1];
        if (building) {
          rrPath(ctx, px - r, py - r, r * 2, r * 2, r * 0.3);
        } else {
          ctx.beginPath();
          ctx.arc(px, py, r, 0, TAU);
        }
        ctx.fillStyle = col;
        ctx.fill();
        this._emoji(card.unit ? unitEmoji(card.unit) : '?', px, py, Math.max(0.36, (building ? 1.3 : 1.5) * r));
      }
    }
    ctx.restore();
  };

  // ---------- UI ----------

  Renderer.prototype._crowns = function (x, cy, count, t, align) {
    var ctx = this.ctx;
    var col = teamColor(t);
    var cw = 15;
    var ch = 12;
    var gap = 3;
    var total = 3 * cw + 2 * gap;
    var x0 = align === 'right' ? x - total : x;
    for (var i = 0; i < 3; i++) {
      var on = i < count;
      crownPath(ctx, x0 + i * (cw + gap), cy - ch / 2, cw, ch);
      ctx.fillStyle = on ? col.main : COL.crownOff;
      ctx.fill();
      if (on) {
        ctx.lineWidth = 1;
        ctx.strokeStyle = col.dark;
        ctx.stroke();
      }
    }
  };

  Renderer.prototype._drawTopBar = function (game, team) {
    var ctx = this.ctx;
    var I = this.insets;
    var cssW = this.cssW;
    ctx.fillStyle = COL.topBar;
    ctx.fillRect(0, 0, cssW, I.top + TOP_BAR_H);

    var yLabel = I.top + 11;
    var yRow = I.top + 31;
    var cx = cssW / 2;
    var enemy = 1 - team;
    var pl = game && game.players ? game.players : null;
    var eC = pl && pl[enemy] ? pl[enemy].crowns | 0 : 0;
    var pC = pl && pl[team] ? pl[team].crowns | 0 : 0;

    // Left edge reserves room for the HTML pause button that sits over the top bar.
    var leftX = I.left + MARGIN + 40;
    uiText(ctx, 'Opponent', leftX, yLabel, 10, COL.textDim, '600', 'left', 'middle');
    this._crowns(leftX, yRow, eC, enemy, 'left');
    this._crowns(cssW - I.right - MARGIN, yRow, pC, team, 'right');

    if (!game) return;
    if (game.phase === 'overtime') {
      uiText(ctx, 'Overtime', cx, yLabel, 9, COL.orange, '700', 'center', 'middle');
    }
    var label = fmtTime(game.timeLeft);
    ctx.font = '700 17px ' + FONT;
    var tw = ctx.measureText(label).width;
    uiText(ctx, label, cx, yRow, 17, COL.text, '700', 'center', 'middle');

    var mult = game.elixirMult | 0;
    if (mult > 1) {
      var bx = cx + tw / 2 + 8;
      var by = yRow - 8;
      rrPath(ctx, bx, by, 30, 16, 5);
      ctx.fillStyle = COL.elixir;
      ctx.fill();
      uiText(ctx, 'x' + mult, bx + 15, by + 8.5, 10, '#ffffff', '700', 'center', 'middle');
    }
  };

  // Elixir drop, count, and 10 segments with a partial fill.
  Renderer.prototype._drawElixir = function (elixir) {
    var ctx = this.ctx;
    var b = this.barRect;
    var e = clamp(elixir || 0, 0, 10);
    var dr = 11;
    var dcx = b.x + dr;
    var dcy = b.y + b.h / 2;
    dropPath(ctx, dcx, dcy, dr * 0.8);
    ctx.fillStyle = COL.drop;
    ctx.fill();
    uiText(ctx, String(Math.floor(e)), dcx, dcy + 1, 12, '#ffffff', '700', 'center', 'middle');

    var sx0 = b.x + dr * 2 + 8;
    var sx1 = b.x + b.w;
    var gap = 3;
    var segW = (sx1 - sx0 - gap * 9) / 10;
    for (var i = 0; i < 10; i++) {
      var x = sx0 + i * (segW + gap);
      rrPath(ctx, x, b.y, segW, b.h, 4);
      ctx.fillStyle = COL.segBack;
      ctx.fill();
      var f = clamp(e - i, 0, 1);
      if (f > 0) {
        rrPath(ctx, x, b.y, Math.max(2, segW * f), b.h, 4);
        ctx.fillStyle = COL.elixir;
        ctx.fill();
        ctx.fillStyle = COL.elixirHi;
        ctx.fillRect(x + 2, b.y + 3, Math.max(0, segW * f - 4), 2);
      }
    }
  };

  // One card: rarity frame, art with emoji, name band, cost circle, and affordability fill.
  Renderer.prototype._card = function (cardId, x, y, w, h, o) {
    var ctx = this.ctx;
    o = o || {};
    var card = cardDef(cardId);
    if (!card) {
      rrPath(ctx, x, y, w, h, 7);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
      return;
    }
    var frame = RARITY[card.rarity] || RARITY.common;
    rrPath(ctx, x, y, w, h, 7);
    ctx.fillStyle = frame;
    ctx.fill();

    var ix = x + 2.5;
    var iy = y + 2.5;
    var iw = w - 5;
    var ih = h - 5;
    rrPath(ctx, ix, iy, iw, ih, 5);
    ctx.fillStyle = COL.cardArt;
    ctx.fill();

    var bandH = o.compact ? 13 : Math.max(14, h * 0.24);
    var artH = ih - bandH;
    rrPath(ctx, ix, iy + artH, iw, bandH, 4);
    ctx.fillStyle = COL.cardBand;
    ctx.fill();

    this._emoji(card.emoji || '?', x + w / 2, iy + artH / 2 + 1, Math.min(artH * 0.72, w * 0.52));

    var label = o.label || card.name || '';
    var fs = o.compact ? 9 : 10.5;
    ctx.font = '700 ' + fs + 'px ' + FONT;
    while (fs > 6 && ctx.measureText(label).width > iw - 6) {
      fs -= 0.5;
      ctx.font = '700 ' + fs + 'px ' + FONT;
    }
    uiText(ctx, label, x + w / 2, iy + artH + bandH / 2 + 0.5, fs, COL.text, '700', 'center', 'middle');

    if (card.cost != null) {
      var cr = Math.max(8, Math.min(11, h * 0.15));
      var ccx = ix + cr + 3;
      var ccy = iy + artH - cr - 3;
      ctx.beginPath();
      ctx.arc(ccx, ccy, cr, 0, TAU);
      ctx.fillStyle = COL.drop;
      ctx.fill();
      uiText(ctx, String(card.cost), ccx, ccy + 0.5, cr * 1.15, '#ffffff', '700', 'center', 'middle');
    }

    if (o.elixir != null && card.cost > o.elixir) {
      var f = clamp(o.elixir / card.cost, 0, 1);
      ctx.save();
      rrPath(ctx, ix, iy, iw, ih, 5);
      ctx.clip();
      ctx.fillStyle = 'rgba(30,26,44,0.55)';
      ctx.fillRect(ix, iy, iw, ih);
      ctx.fillStyle = 'rgba(201,107,245,0.45)';
      ctx.fillRect(ix, iy + ih - f * ih, iw, f * ih);
      ctx.restore();
    }

    if (o.selected) {
      rrPath(ctx, x, y, w, h, 7);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = COL.gold;
      ctx.stroke();
    }
  };

  Renderer.prototype._drawPanel = function (game, team, uiState) {
    var ctx = this.ctx;
    var top = this.panelTop;
    ctx.fillStyle = COL.panel;
    ctx.fillRect(0, top, this.cssW, this.cssH - top);
    ctx.fillStyle = COL.panelEdge;
    ctx.fillRect(0, top, this.cssW, 1);

    var p = game && game.players ? game.players[team] : null;
    var elixir = p ? p.elixir || 0 : 0;
    this._drawElixir(elixir);

    var nr = this.nextRect;
    this._card(p ? p.next : null, nr.x, nr.y, nr.w, nr.h, { compact: true, label: 'next' });

    var sel = uiState.selected;
    for (var i = 0; i < 4; i++) {
      var r = this.cardRects[i];
      var isSel = i === sel;
      var y = isSel ? r.y - CARD_LIFT : r.y;
      this._card(p && p.hand ? p.hand[i] : null, r.x, y, r.w, r.h, {
        elixir: elixir,
        selected: isSel
      });
    }
  };

  // ---------- public API ----------

  CR.Renderer = Renderer;
})();

// Sound effects: a tiny WebAudio synth, no audio files.
// Safe to load in Node: nothing touches window or AudioContext until a sound plays.
var CR = (globalThis.CR = globalThis.CR || {});

CR.Audio = (function () {
  'use strict';

  var VOLUME = 0.5;
  var HIT_LIMIT = 12; // hit sounds per second, the rest are dropped
  var ctx = null;
  var master = null;
  var muted = false;
  var hitTimes = [];

  // Note: f start freq, f2 optional end freq (sweep), type, dur seconds, v peak gain, d delay seconds.
  var SOUNDS = {
    deploy: [{ f: 520, f2: 700, type: 'sine', dur: 0.09, v: 0.10 }],
    hit: [{ f: 260, f2: 200, type: 'triangle', dur: 0.05, v: 0.06 }],
    spell: [
      { f: 330, f2: 880, type: 'sawtooth', dur: 0.22, v: 0.04 },
      { f: 660, type: 'sine', dur: 0.20, v: 0.04, d: 0.08 }
    ],
    towerDown: [
      { f: 330, type: 'square', dur: 0.25, v: 0.04 },
      { f: 247, type: 'square', dur: 0.30, v: 0.04, d: 0.18 },
      { f: 165, type: 'triangle', dur: 0.50, v: 0.08, d: 0.36 }
    ],
    king: [
      { f: 392, type: 'triangle', dur: 0.20, v: 0.07 },
      { f: 523, type: 'triangle', dur: 0.20, v: 0.07, d: 0.15 },
      { f: 784, type: 'triangle', dur: 0.45, v: 0.08, d: 0.30 }
    ],
    win: [
      { f: 523, type: 'sine', dur: 0.14, v: 0.08 },
      { f: 659, type: 'sine', dur: 0.14, v: 0.08, d: 0.12 },
      { f: 784, type: 'sine', dur: 0.14, v: 0.08, d: 0.24 },
      { f: 1047, type: 'sine', dur: 0.40, v: 0.08, d: 0.36 }
    ],
    lose: [
      { f: 392, type: 'triangle', dur: 0.30, v: 0.07 },
      { f: 330, type: 'triangle', dur: 0.30, v: 0.07, d: 0.20 },
      { f: 294, type: 'triangle', dur: 0.30, v: 0.07, d: 0.40 },
      { f: 262, type: 'triangle', dur: 0.45, v: 0.07, d: 0.60 }
    ],
    error: [
      { f: 150, type: 'square', dur: 0.12, v: 0.04 },
      { f: 120, type: 'square', dur: 0.12, v: 0.04, d: 0.06 }
    ],
    tick: [{ f: 1000, type: 'sine', dur: 0.05, v: 0.05 }],
    elixirFull: [
      { f: 880, type: 'sine', dur: 0.08, v: 0.05 },
      { f: 1320, type: 'sine', dur: 0.12, v: 0.05, d: 0.09 }
    ]
  };

  function ensure() {
    if (ctx) return ctx;
    var AC = globalThis.AudioContext || globalThis.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : VOLUME;
      master.connect(ctx.destination);
    } catch (e) {
      ctx = null;
      master = null;
    }
    return ctx;
  }

  function note(n, t0) {
    var start = t0 + (n.d || 0);
    var end = start + n.dur;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = n.type || 'sine';
    osc.frequency.setValueAtTime(n.f, start);
    if (n.f2) osc.frequency.exponentialRampToValueAtTime(n.f2, end);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(n.v, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, end);
    osc.connect(gain);
    gain.connect(master);
    osc.start(start);
    osc.stop(end + 0.02);
  }

  function allowHit(now) {
    while (hitTimes.length && now - hitTimes[0] > 1000) hitTimes.shift();
    if (hitTimes.length >= HIT_LIMIT) return false;
    hitTimes.push(now);
    return true;
  }

  return {
    // Call from a user gesture so iOS allows audio output.
    unlock: function () {
      var c = ensure();
      if (c && c.state === 'suspended') {
        try { c.resume(); } catch (e) { /* ignore */ }
      }
    },

    play: function (name) {
      var notes = SOUNDS[name];
      if (!notes || muted) return;
      var c = ensure();
      if (!c) return;
      if (c.state !== 'running') return;
      if (name === 'hit' && !allowHit(Date.now())) return;
      var t0 = c.currentTime + 0.005;
      for (var i = 0; i < notes.length; i++) note(notes[i], t0);
    },

    setMuted: function (m) {
      muted = !!m;
      if (master) master.gain.value = muted ? 0 : VOLUME;
    }
  };
})();

  var COLLECTION = Object.keys(CR.CARDS).sort(function (a, b) {

  function avg(ids) {
    var t = 0;
    for (var i = 0; i < ids.length; i++) t += CR.CARDS[ids[i]].cost;

  function speedTier(v) {

  function crowns(n, color) {
