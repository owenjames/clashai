# XcodeGen spec. Regenerate with: cd ios && xcodegen generate
name: ClashAI
options:
  bundleIdPrefix: com.owenjames
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # The Web folder is read by the pre-build script, so the sandbox must allow it.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ClashAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClashAI/Sources
      - path: ClashAI/Assets.xcassets
      - path: ClashAI/Web
        type: folder
    info:
      path: ClashAI/Info.plist
      properties:
        CFBundleDisplayName: ClashAI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: ClashAI
        PRODUCT_BUNDLE_IDENTIFIER: com.owenjames.clashai
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Build web bundle
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          # Rebuilds ClashAI/Web from js/ and index.html. Falls back to the committed files if node is missing.
          ROOT="${PROJECT_DIR}/.."
          NODE=""
          for d in $(echo "$PATH" | tr ':' ' ') /opt/homebrew/bin /usr/local/bin "$HOME/.local/bin"; do
            if [ -x "$d/node" ]; then NODE="$d/node"; break; fi
          done
          if [ -z "$NODE" ]; then
            echo "warning: node not found, using the committed web files in ClashAI/Web"
            exit 0
          fi
          cd "$ROOT" && "$NODE" tools/build.js
