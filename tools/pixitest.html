<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../">
<link rel="icon" href="data:,">
<title>Pixi battle test</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #cfd8ea; font: 12px/1.3 Arial, sans-serif; }
  #wrap { position: relative; width: 390px; height: 844px; margin: 0 auto; }
  canvas { display: block; width: 390px; height: 844px; }
  #fps { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="390" height="844"></canvas>
  <div id="fps">fps --</div>
</div>
<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/botconfig.js"></script>
<script src="js/bot.js"></script>
<script src="js/ai.js"></script>
<script src="js/vendor/pixi.min.js"></script>
<script src="js/troopart.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render-pixi.js"></script>
<script>
// AI vs AI battle drawn with CR.PixiRenderer, for visual and frame-rate checks.
// Restarts after each result. Add ?seed=N to pick the match.
(function () {
  'use strict';
  var canvas = document.getElementById('game');
  var fpsEl = document.getElementById('fps');
  var seed = parseInt((/[?&]seed=(\d+)/.exec(location.search) || [0, 12345])[1], 10);
  var renderer = new CR.PixiRenderer(canvas);
  renderer.resize(390, 844, Math.min(window.devicePixelRatio || 1, 2), { top: 0, bottom: 0, left: 0, right: 0 });
  var game = null;
  var ai0 = null;
  var ai1 = null;
  var uiState = { selected: -1, drag: null, team: 0, emote: [null, null] };
  var acc = 0;
  var last = 0;
  var frames = 0;
  var fpsT = 0;
  var matches = 0;

  function start() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    var decks = [CR.AI_DECKS[seed % CR.AI_DECKS.length].slice(), CR.AI_DECKS[(seed >> 3) % CR.AI_DECKS.length].slice()];
    game = new CR.Game({ decks: decks, seed: seed });
    ai0 = new CR.AI(game, 0, { difficulty: 'normal' });
    ai1 = new CR.AI(game, 1, { difficulty: 'normal' });
    matches++;
    acc = 0;
  }

  function step(dt) {
    if (game.result) return;
    game.update(dt);
    if (ai0) ai0.update(dt);
    if (ai1) ai1.update(dt);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    acc += dt;
    var n = 0;
    while (acc >= 1 / 30 && n < 5) {
      step(1 / 30);
      acc -= 1 / 30;
      n++;
    }
    if (acc > 1 / 30) acc = 0;
    if (game.result && now - (game.endedAt || (game.endedAt = now)) > 2500) {
      start();
    }
    if (renderer.ready) renderer.draw(game, uiState);
    frames++;
    fpsT += dt;
    if (fpsT >= 0.5) {
      fpsEl.textContent = 'fps ' + Math.round(frames / fpsT) + '  t ' + game.time.toFixed(0) + 's  match ' + matches;
      frames = 0;
      fpsT = 0;
    }
  }

  // Headless hook: advance(seconds) steps the battle and draws once, without the frame loop.
  window.CR_TEST = {
    get game() { return game; },
    renderer: renderer,
    uiState: uiState,
    // Steps the battle. The last second draws every tick, like the real loop, so timed visuals settle.
    advance: function (sec) {
      var ticks = Math.round(sec * 30);
      for (var i = 0; i < ticks; i++) {
        step(1 / 30);
        if (renderer.ready && (i >= ticks - 30 || i === ticks - 1)) renderer.draw(game, uiState);
      }
      if (renderer.ready) renderer.draw(game, uiState);
      return game.time;
    }
  };
  start();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
